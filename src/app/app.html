<main class="container py-4" style="max-width: 800px;">
  <h1 class="mb-4 text-center">Mano užrašai</h1>

  <!-- Forma -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Antraštė</label>
        <input class="form-control" [(ngModel)]="title" placeholder="Antraštė" />
      </div>
      <div class="mb-3">
        <label class="form-label">Tekstas</label>
        <textarea class="form-control" rows="3" [(ngModel)]="text" placeholder="Užrašo tekstas..."></textarea>
      </div>
      <button class="btn btn-warning w-100" (click)="add()">Pridėti</button>
    </div>
  </div>

  <!-- Užrašų sąrašas -->
  <div class="row g-3">
    @for (note of notes; track note.id) {
      <div class="col-12 col-sm-6">
        <div class="card h-100 shadow-sm bg-warning-subtle">
          <div class="card-body">
            <h5 class="card-title">{{ note.title }}</h5>
            <p class="card-text" style="white-space: pre-wrap;">{{ note.text }}</p>
          </div>
          <div class="card-footer bg-transparent border-0">
            <button class="btn btn-sm btn-danger" (click)="remove(note.id)">Ištrinti</button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center text-muted">Užrašų dar nėra.</p>
    }
  </div>
</main>
